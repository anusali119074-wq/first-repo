
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            color: #00d4ff;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #00d4ff;
        }

        .hero {
            height: 450px;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            background: #00d4ff;
            color: #222;
            padding: 14px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: white;
        }

        .services {
            padding: 60px 8%;
            text-align: center;
        }

        .services h2 {
            font-size: 32px;
            margin-bottom: 35px;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 35px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #0002;
        }

        .card h3 {
            color: #007bff;
            margin-bottom: 15px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin: 5px;
                display: inline-block;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MyWebsite</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Welcome To My Website</h1>
            <p>Build Your Future With Creativity</p>
            <button>Get Started</button>
        </div>
    </section>

    <section class="services">
        <h2>Our Services</h2>

        <div class="cards">

            <div class="card">
                <h3>Web Design</h3>
                <p>Beautiful and modern website designs.</p>
            </div>

            <div class="card">
                <h3>Development</h3>
                <p>Professional website development.</p>
            </div>

            <div class="card">
                <h3>SEO</h3>
                <p>Improve your website visibility.</p>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
